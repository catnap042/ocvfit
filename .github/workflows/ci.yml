name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test
        run: pytest -q
      - name: Run examples
        run: |
          python examples/quickstart.py
          python examples/quickstart.py --chemistry nmc532
          python examples/cathode_fixed.py
          python examples/blended_cathode.py
          python examples/make_example_csv.py
          git diff --exit-code -- examples/data || echo "example CSVs differ from regenerated copies (platform float formatting)"
