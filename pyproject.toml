[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ocvfit"
version = "0.1.0"
description = "Fit full-cell OCV curves from half-cell OCP curves and quantify lithium-ion degradation modes (LLI, LAM_PE, LAM_NE)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "catnap42" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "scipy>=1.9"]
keywords = [
    "lithium-ion", "battery", "ocv", "open-circuit voltage", "open-circuit potential",
    "half-cell", "electrode alignment", "degradation modes", "battery degradation",
    "LLI", "LAM", "loss of lithium inventory", "loss of active material",
    "dQ/dV", "dV/dQ", "incremental capacity analysis", "differential voltage analysis",
    "LFP", "NMC", "graphite", "state of health", "battery diagnostics", "electrochemistry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7", "matplotlib>=3.5"]

[project.urls]
Repository = "https://github.com/catnap042/ocvfit"
Issues = "https://github.com/catnap042/ocvfit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ocvfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B905"]
