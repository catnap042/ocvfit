[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ocvfit"
version = "0.1.0"
description = "Fit full-cell OCV curves from half-cell OCP curves and quantify lithium-ion degradation modes (LLI, LAM_PE, LAM_NE)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "catnap42" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "scipy>=1.9"]
keywords = ["battery", "lithium-ion", "OCV", "open-circuit voltage", "degradation", "dV/dQ", "incremental capacity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/catnap042/ocvfit"
Issues = "https://github.com/catnap042/ocvfit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ocvfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B905"]
